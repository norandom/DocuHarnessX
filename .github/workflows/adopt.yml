# Reusable workflow for consuming repositories.
# Install with: dhx install-ci
# Or copy:
#   jobs:
#     adopt:
#       uses: norandom/DocuHarnessX/.github/workflows/adopt.yml@v2.0.0
#       secrets:
#         OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
#       with:
#         openai_api_base: ${{ vars.OPENAI_API_BASE }}
#         openai_default_main_model: ${{ vars.OPENAI_DEFAULT_MAIN_MODEL }}
#
# Credentials:
# - OPENAI_API_KEY is a repository *secret* (never a variable).
# - Base URL and model are inputs, typically from repository *variables*.
#   Unset/empty inputs default to DeepSeek.
#
# Evolution design (agents that commit code):
# - Generation and evolve are separate jobs.
# - Commits tagged [dhx] skip both jobs (loop breaker).
# - Evolve never pushes to the agent's branch; it opens dhx/evolve.
# - Evolve runs only when journals change, not on every code-agent push.
# - An existing dhx/evolve PR blocks another evolve run.
name: DocuHarnessX adopt
on:
  workflow_call:
    inputs:
      evolve:
        description: off or pr (never commit evolve snapshots to the pushing branch)
        type: string
        default: pr
      dhx_ref:
        description: DocuHarnessX git ref for uvx when source=git
        type: string
        default: v2.0.0
      source:
        description: git (uvx from GitHub at dhx_ref) or checkout (this working tree)
        type: string
        default: git
      openai_api_base:
        description: OpenAI-compatible base URL (repo variable; not a secret)
        type: string
        default: https://api.deepseek.com
      openai_default_main_model:
        description: Model id (repo variable; not a secret)
        type: string
        default: deepseek-v4-flash
    secrets:
      OPENAI_API_KEY:
        required: false

jobs:
  docs:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[dhx]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
      - name: Incremental living docs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ inputs.openai_api_base != '' && inputs.openai_api_base || 'https://api.deepseek.com' }}
          OPENAI_DEFAULT_MAIN_MODEL: ${{ inputs.openai_default_main_model != '' && inputs.openai_default_main_model || 'deepseek-v4-flash' }}
          DHX_SOURCE: ${{ inputs.source }}
          DHX_REF: ${{ inputs.dhx_ref }}
        run: |
          set -euo pipefail
          if [ "$DHX_SOURCE" = "checkout" ]; then
            uvx --python 3.12 --from . dhx ci .
          else
            uvx --python 3.12 --from "git+https://github.com/norandom/DocuHarnessX.git@${DHX_REF}" dhx ci .
          fi
      - name: Commit MkDocs if needed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add fails if a pathspec is missing (adoption.yaml / pages
          # are created by init/run, not always present on first CI).
          for p in docs mkdocs.yml .docuharnessx .github/workflows/docs.yml; do
            if [ -e "$p" ]; then
              git add -- "$p"
            fi
          done
          if git diff --cached --quiet; then
            echo "dhx ci: no doc changes to commit"
            exit 0
          fi
          git commit -m "[dhx] update living docs and MkDocs"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  evolve:
    needs: docs
    if: ${{ inputs.evolve == 'pr' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[dhx]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Journals changed?
        id: journals
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" HEAD | grep -q '^\.docuharnessx/journals/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up uv
        if: steps.journals.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v4
      - name: Evolve harness snapshot
        if: steps.journals.outputs.changed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ inputs.openai_api_base != '' && inputs.openai_api_base || 'https://api.deepseek.com' }}
          OPENAI_DEFAULT_MAIN_MODEL: ${{ inputs.openai_default_main_model != '' && inputs.openai_default_main_model || 'deepseek-v4-flash' }}
          DHX_SOURCE: ${{ inputs.source }}
          DHX_REF: ${{ inputs.dhx_ref }}
        run: |
          set -euo pipefail
          if [ "$DHX_SOURCE" = "checkout" ]; then
            uvx --python 3.12 --from . dhx evolve .
          else
            uvx --python 3.12 --from "git+https://github.com/norandom/DocuHarnessX.git@${DHX_REF}" dhx evolve .
          fi
      - name: Open evolve PR
        if: steps.journals.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: dhx/evolve
          delete-branch: false
          title: "[dhx] harness evolution"
          commit-message: "[dhx] evolve harness snapshot"
          add-paths: |
            .docuharnessx/harnesses
            .docuharnessx/adoption.yaml
          body: |
            Proposed harness snapshot from project journals.
            Review the comparison gate before merge. This PR is never opened from a `[dhx]` docs commit.

# Reusable workflow for consuming repositories.
# Install with: dhx install-ci
# Or copy:
#   jobs:
#     adopt:
#       uses: norandom/DocuHarnessX/.github/workflows/adopt.yml@v2.0.0
#
# Evolution design (agents that commit code):
# - Generation and evolve are separate jobs.
# - Commits tagged [dhx] skip both jobs (loop breaker).
# - Evolve never pushes to the agent's branch; it opens dhx/evolve.
# - Evolve runs only when journals change, not on every code-agent push.
# - An existing dhx/evolve PR blocks another evolve run.
name: DocuHarnessX adopt
on:
  workflow_call:
    inputs:
      evolve:
        description: off or pr (never commit evolve snapshots to the pushing branch)
        type: string
        default: pr
      dhx_ref:
        description: DocuHarnessX git ref for uvx
        type: string
        default: v2.0.0
    secrets:
      OPENAI_API_KEY:
        required: false
      OPENAI_API_BASE:
        required: false
      OPENAI_DEFAULT_MAIN_MODEL:
        required: false

jobs:
  docs:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[dhx]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
      - name: Incremental living docs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_DEFAULT_MAIN_MODEL: ${{ secrets.OPENAI_DEFAULT_MAIN_MODEL }}
        run: >
          uvx --python 3.12
          --from "git+https://github.com/norandom/DocuHarnessX.git@${{ inputs.dhx_ref }}"
          dhx ci .
      - name: Commit MkDocs if needed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[dhx] update living docs and MkDocs"
          file_pattern: docs mkdocs.yml .docuharnessx/pages .docuharnessx/adoption.yaml .docuharnessx/ontology.yaml .github/workflows/docs.yml

  evolve:
    needs: docs
    if: ${{ inputs.evolve == 'pr' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[dhx]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Journals changed?
        id: journals
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" HEAD | grep -q '^\.docuharnessx/journals/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up uv
        if: steps.journals.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v4
      - name: Evolve harness snapshot
        if: steps.journals.outputs.changed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_DEFAULT_MAIN_MODEL: ${{ secrets.OPENAI_DEFAULT_MAIN_MODEL }}
        run: >
          uvx --python 3.12
          --from "git+https://github.com/norandom/DocuHarnessX.git@${{ inputs.dhx_ref }}"
          dhx evolve .
      - name: Open evolve PR
        if: steps.journals.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: dhx/evolve
          delete-branch: false
          title: "[dhx] harness evolution"
          commit-message: "[dhx] evolve harness snapshot"
          add-paths: |
            .docuharnessx/harnesses
            .docuharnessx/adoption.yaml
          body: |
            Proposed harness snapshot from project journals.
            Review the comparison gate before merge. This PR is never opened from a `[dhx]` docs commit.
